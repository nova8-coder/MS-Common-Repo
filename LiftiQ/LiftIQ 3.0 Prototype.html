 pumps:[0,1,2].map(()=>({on:R()<.3,mode:R()<.85?'AUTO':'REMOTE',amp:0,starts:ri(8,40),run:ri(300,900)})),last:R()<.85?ri(0,4):R()<.5?ri(70,900):null,

const EV=[];function tick(){ST.forEach((s,i)=>{if(s.last==null||s.last>60)return;s.last=0;const on=PW(s).some(p=>p.on);s.level=Math.max(.5,Math.min(9.5,s.level+(on?-.28:.16)+(R()-.5)*.08));
 PW(s).forEach((p,j)=>{const w=p.on;if(!w&&s.level>6.5&&(j==0||PW(s)[0].on)&&!PW(s).some(q=>q.on)||(!w&&s.level>7.6)){p.on=true;p.starts++;if(i==0)EV.unshift([0,`Pump ${j+1} started`,'Level '+f1(s.level)+' ft'])}else if(w&&s.level<3.6){p.on=false;if(i==0)EV.unshift([0,`Pump ${j+1} stopped`,'Level '+f1(s.level)+' ft'])}
  p.amp=p.on?18+R()*4:0;if(p.on)p.run+=.05});s.flow=PW(s).filter(p=>p.on).length*(210+R()*30)});if(EV.length>20)EV.length=20;if(!/INPUT|SELECT/.test(document.activeElement.tagName))draw()}

const P={stations:1,alarms:1,cmds:1},S={q:'',f:'all',sort:'name',size:10,af:'all',as:'all',range:'24h',metric:'level',cf:'all',cmd:null,run:null,col:{lvl:1,flow:1,alm:1,dev:1,mt:1}};
const pager=(k,n)=>{const pc=Math.max(1,Math.ceil(n/S.size));P[k]=Math.min(P[k],pc);return`<div class="pg"><span>${n} records</span><select data-s="size">${[10,25,50].map(x=>`<option ${x==S.size?'selected':''}>${x}</option>`).join('')}</select><button data-a="pg:${k}:-1" ${P[k]<2?'disabled':''}>Prev</button>Page ${P[k]} of ${pc}<button data-a="pg:${k}:1" ${P[k]>=pc?'disabled':''}>Next</button></div>`},

 v.forEach((x,i)=>{if(x==null){if(seg)p+=seg;seg='';if(v[i-1]!=null)gaps+=`<rect x="${X(i-1)}" y="4" width="${X(i+3)-X(i-1)}" height="${h-22}" fill="var(--gyb)"/>`}else seg+=(seg?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)});p+=seg;

 const h=ST.filter(s=>stat(s)[2]=='Healthy').length,cm=ST.filter(s=>s.last==null||s.last>60).length,md=ST.filter(s=>s.maint!='OK').length,k=(a,b,c)=>`<div class="c"><div class="k">${a}</div><div class="v ${c||''}">${b}</div></div>`;

 <div class="g g2" style="margin-top:10px"><div class="c"><h2>Level, last 24 h</h2>${line(series(id,'level','24h'))}</div><div class="c"><h2>Active alarms</h2>${hl?`<p>${bd('cr','✖','Critical')} High Wet Well Level · live · level ${f1(s.level)} ft over 8.0 ft threshold</p>`:''}${act.length?act.map(a=>`<p>${bd(...SEV[a.sev],a.sev)} ${a.type} · ${a.eq} · ${dur(a.st)} · ${bd(STB[a.state],'',a.state)}</p>`).join(''):hl?'':'<p>No active alarms.</p>'}<h2>Recent events</h2>${EV.slice(0,5).map(e=>`<div>${bd('in','','Live')} ${e[1]} <span class="k">${e[2]}</span></div>`).join('')||'<span class="k">Waiting for live events…</span>'}</div></div>

 if(tab=='alarms'){const a=A.filter(x=>(S.as=='all'||x.state==S.as)&&(S.af=='all'||x.sev==S.af));return t0+`<div class="bar"><select data-s="as">${['all','ACTIVE','ACKNOWLEDGED','CLEARED','CLOSED'].map(x=>`<option ${x==S.as?'selected':''}>${x}</option>`).join('')}</select><select data-s="af">${['all','Critical','Warning'].map(x=>`<option ${x==S.af?'selected':''}>${x}</option>`).join('')}</select><span class="k">Lifecycle: Active → Acknowledged → Cleared → Closed</span></div><div class="c tw"><table><tr><th>Alarm</th><th>Severity</th><th>Equipment</th><th>Source / threshold</th><th>Started</th><th>Duration</th><th>State</th><th>Acknowledged</th><th>Cleared</th></tr>${sl(a,'alarms').map(x=>`<tr><td>${x.type}</td><td>${bd(...SEV[x.sev],x.sev)}</td><td>${x.eq}</td><td>${x.src} · ${x.thr}</td><td>${fmt(x.st)}</td><td>${dur(x.d)}${x.state=='ACTIVE'?' (ongoing)':''}</td><td>${bd(STB[x.state],'',x.state)}${x.state=='ACTIVE'?` <button data-a="ack:${x.id}">Acknowledge</button>`:''}</td><td>${x.ack?fmt(x.ack):'—'}</td><td>${x.clr?fmt(x.clr):'—'}</td></tr>`).join('')}</table></div>${pager('alarms',a.length)}`}

 return t0+`<div class="g g2"><div class="c"><h2>Pump 1: current state</h2><p>${PW(s)[0].on?bd('ok','●','Running'):bd('gy','○','Off')} Mode <b>${PW(s)[0].mode}</b></p><h2>Available actions</h2><div class="bar"><button data-a="send:Pump 1 mode → REMOTE" ${r?'disabled':''}>Change mode to Remote</button><button data-a="send:Pump 1 → ON" ${r?'disabled':''}>Turn ON</button></div><div class="k">A click only requests the command. It is confirmed when the device reports the new state.</div></div><div class="c"><h2>${r?r.n:'Command status'}</h2>${r?sh(r):'<span class="k">No command in progress.</span>'}${cur?`<h2 style="margin-top:10px">Selected: ${cur.id}</h2>${sh(cur)}`:''}</div></div>
 <h2 style="margin:12px 0 6px">Command history</h2><div class="bar"><select data-s="cf">${['all',...Object.keys(CB)].map(x=>`<option ${x==S.cf?'selected':''}>${x}</option>`).join('')}</select></div><div class="c tw"><table><tr><th>Command</th><th>Requested</th><th>By</th><th>Target</th><th>Previous</th><th>Requested state</th><th>Status</th><th>Completed</th></tr>${sl(C,'cmds').map(c=>`<tr data-a="cmd:${c.id}"><td>${c.c}</td><td>${fmt(c.t)}</td><td>${c.by}</td><td>${c.eq}</td><td>${c.prev}</td><td>${c.req}</td><td>${bd(CB[c.s],'',c.s)}</td><td>${c.done?fmt(c.t-ri(1,3)):'—'}</td></tr>`).join('')}</table></div>${pager('cmds',C.length)}`}
 if(tab=='history'){const items=[['Oct 6','alarm','High level alarm cleared'],['Oct 1','access','Account relationship changed (Metro Utilities → '+s.acct+')'],['Sep 30','command','Pump 1 mode changed Auto → Remote by System'],['Sep 1','asset','Asset renamed NOVA01 → '+s.name],['Aug 20','device','Device replaced (device-92771 → '+s.dev+')'],['May 18','maintenance','Maintenance performed on Pump 1'],['Mar 12','alarm','High level alarm'],['Feb 4','config','Pump 1 configuration changed'],['Jan 10','asset','Asset created']];

 return t0+'<p>Not part of this first build.</p>'};
V.comparison=()=>{const r=[['Navigation','Command pages sit at the same level as monitoring pages.','Operator must hunt for status among command screens.','Overview first; commands and configuration become secondary tabs.'],['Station overview','Health, pump status and last report are scattered.','No single answer to “is this station OK?”','One command-center page with summary, equipment, alarms and trends.'],['Alarms','Alarm shown mainly as an icon or event row.','No lifecycle, duration or acknowledgement context.','Alarm entity: active → acknowledged → cleared → closed.'],['Commands','Send buttons per pump and parameter.','Success is easy to assume after clicking.','Requested → sent → acknowledged → confirmed / failed / timed out.'],['Command history','Separate list page.','Cannot see state before and after the change.','Paginated table with previous and requested state.'],['Asset and device history','Single activity-style record.','Renames, device swaps and moves mix with operations.','Separate asset timeline and device association history.'],['Live monitoring','Refresh to see changes.','Stale values look current.','Pushed updates, live indicator, explicit stale and missing states.']];
 return head('Current vs proposed','LiftIQ / Comparison')+`<div class="bar"><span class="b gy">KNOWN</span> from screenshots <span class="b in">PROPOSED</span> design <span class="b in">DERIVED</span> computed from telemetry <span class="b wn">ASSUMPTION</span> <span class="b cr">OPEN</span> needs product decision</div><div class="c tw"><table><tr><th>Area</th><th>Current approach</th><th>Problem</th><th>Proposed approach</th></tr>${r.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table></div><div class="c" style="margin-top:10px"><h2>Open product questions</h2><p>${bd('cr','','OPEN')} Who may acknowledge alarms, and does acknowledgement also reach the device?</p><p>${bd('wn','','ASSUMPTION')} Alarm closure is automatic once cleared and acknowledged.</p><p>${bd('wn','','ASSUMPTION')} Health score weights (alarms, comms age, maintenance) are placeholders.</p><p>${bd('cr','','OPEN')} Which pump metrics beyond station flow can be derived without firmware changes?</p></div>`};
