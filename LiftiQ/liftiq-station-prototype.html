<div class="kp"><div><small>Pump ${i+1} · ${ROLE[i]}</small><b>On</b><small>Auto mode, as last reported</small></div><div><small>Current (measured)</small><b>${m[2+i*2]} A</b><small>${f(m[0])}</small></div><div><small>Run Hours (measured)</small><b>${m[3+i*2]} hrs</b><small>${f(m[0])}</small></div><div><small>Turn On / Off level</small><b>${SP[i].on} / ${SP[i].off} in</b><small>Setpoints from the Visual Twin</small></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="card"><h3>Calculated metrics</h3><div style="padding:12px"><b>Unavailable</b><p class="mu">Capacity, peak capacity, deviation and health score are not shown. They need per-pump flow data and validated calculation rules that are not part of the supplied data.</p></div></div>
<div class="card"><h3>Alarms (last 30 days)</h3><div style="padding:12px">${an.length?an.map(x=>`<div>${f(x.s)} ${x.type} <span class="ch ${S(x)}">${S(x)}</span></div>`).join(""):"None"}<p><button class="lk" data-a="phal" data-c="Pump ${i+1}">View in Alarms</button></p></div></div></div>
<h3>Recent reports (measured)</h3><table><thead><tr><th>Report time</th><th>Current (A)</th><th>Run Hours</th></tr></thead><tbody>${rd.map(x=>`<tr><td>${f(x[0],1)}</td><td>${x[2+i*2]}</td><td>${x[3+i*2]}</td></tr>`).join("")}</tbody></table><p><button class="lk" data-a="tab" data-t="trd">View Pump Run Hours trend</button></p>`};
V.cfg=()=>{const ok=CF==0,L=[["STATION CONFIGURATION",["Stations","Floats"]],["DEVICE SETTINGS",["Analog Input Settings","Digital Input Settings","Digital/Relay Outputs Settings"]]];
const all=L.flatMap(g=>g[1]);return `<div class="cols"><nav>${L.map(g=>`<h6>${g[0]}</h6>`+g[1].map(n=>`<a role="button" tabindex="0" data-a="cf" data-i="${all.indexOf(n)}" class="${all.indexOf(n)==CF?"on":""}">${n}</a>`).join("")).join("")}<p style="margin-top:30px"><button class="btn" data-a="cpl">⟳ Poll Station Configuration</button></p><div class="mu" style="font-size:12px">Last Updated : 10/07/2026 03:39:13 PM</div></nav><main>${ok?`<h2>Station</h2><dl class="dl" style="grid-template-columns:260px 380px;gap:16px"><dt>Configured For</dt><dd><input class="btn" style="width:100%;text-align:left" readonly value="Control"></dd><dt>Number of Pumps</dt><dd><input class="btn" style="width:100%;text-align:left" readonly value="3"></dd><dt>Number of Sensors Enabled</dt><dd><input class="btn" style="width:100%;text-align:left" readonly value="8"></dd></dl>`:`<h2>${all[CF]}</h2><p class="mu">This section's fields were not included in the supplied references, so no values are invented here. The existing menu entry is preserved.</p>`}</main></div>`};
/* ---------- alarm detail ---------- */
const ic={alarm:"🔔",repeat:"🔔",clear:"✓",norm:"✓",detect:"📡",stale:"⏱"};
function detail(id){A.sel=id;const x=D.find(y=>y.id==id),s=S(x),evs=x.ev.map((e,i)=>({...e,i}));
if(sim&&x.st=="Active")evs.push({t:+LAST+TIMEOUT,k:"stale",src:"System",ti:"Marked Stale",d:"Reporting timeout expired. No recent evidence available."});
const tail=s=="Active"?`<div class="ev"><div class="dot k-open"></div><div><b>No clear event received yet</b><div class="mu">${x.note}</div></div></div>`:"";
let box="";const ne=x.ev.find(e=>e.k=="norm");
if(s=="Stale")box=`<div class="warn"><b>Stale: evidence unavailable</b><br>${x.note||"The device stopped reporting after "+f(x.last,1)+". The condition may or may not have continued, so no clear time is assumed."}</div>`;
else if(x.auto)box=`<div class="ok"><b>Completed automatically</b><br>The device clear message was not received. The lifecycle was completed from Status Report evidence, so no user action is needed.<dl class="dl" style="margin:8px 0 0"><dt>Resolution</dt><dd>${x.res}</dd><dt>Evidence time</dt><dd>${f(ne.t,1)}</dd><dt>Evidence</dt><dd>${ne.ev.v} <button class="lk" data-a="ev" data-i="${x.ev.indexOf(ne)}">View Evidence</button></dd></dl></div>`;
else if(s=="Completed")box=`<div class="ok"><b>Completed by device</b><br>Resolved by a device-generated clear message.</div>`;
$("#panel").innerHTML=`<div class="ph"><div class="ch ${s}" style="font-size:20px;padding:8px 12px">🔔</div><div><h2>${x.type}</h2> <span class="ch ${s}">${s}</span><p class="mu" style="margin:4px 0 0">NOVA_02 | ${x.comp} | Severity: ${x.sev}<br>${x.id} | Source: ${x.src}</p></div><button class="x" data-a="close" aria-label="Close detail panel">×</button></div>
${/Level/.test(x.type)?`<p><button class="btn o" data-a="trend" data-id="${x.id}">Go to Level Trend ↗</button></p>`:""}
<div class="card" style="margin-top:10px"><h3>Lifecycle Timeline</h3><div style="padding:6px 12px">${evs.map(e=>`<div class="ev"><div class="dot k-${e.k}">${ic[e.k]}</div><div><div class="mu" style="font-size:12px">${f(e.t,1)}</div><b>${e.ti}</b><span class="src">${e.src}</span><div class="mu">${e.d}${e.ev?` <button class="lk" data-a="ev" data-i="${e.i}">View Evidence</button>`:""}</div></div></div>`).join("")}${tail}</div></div>
<div class="card" style="margin-top:12px"><h3>Current Status</h3><div class="cs"><div><small>Start Time</small>${f(x.s,1)}</div><div><small>Duration</small>${dur(x)}</div><div><small>Last Observed</small>${f(x.last,1)}</div></div></div>${box}<p class="mu" style="font-size:12px">Recovery rule (illustrative): ${x.rule}</p>`;
document.body.classList.add("open");updA()}
const closeP=()=>{A.sel=null;document.body.classList.remove("open");updA()};
function updA(){if(tab!="alm")return;const t=$("#tbl");if(t)t.innerHTML=aTbl();const c=$("#acnt");$("#cnt").textContent=c?c.textContent+" alarm lifecycles":""}
/* ---------- wiring ---------- */
function draw(){shell();$("#view").innerHTML=V[tab]();updA()}
function go(t){tab=t;closeP();draw()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
if(a=="tab")go(d.t);else if(a=="row")detail(d.id);else if(a=="close")closeP();
else if(a=="asub"){A.s=d.s;PG.a=1;draw()}
else if(a=="ev"){const x=D.find(y=>y.id==A.sel),v=x.ev[d.i];mdl(`<h3>Status Report evidence</h3><dl class="dl"><dt>Report time</dt><dd>${f(v.t,1)}</dd><dt>Value / state</dt><dd>${v.ev.v}</dd><dt>Source</dt><dd>${v.src}</dd><dt>Why it was used</dt><dd>${v.ev.why}</dd></dl><button class="btn p" data-a="ok">Close</button>`)}
else if(a=="ok")$("#mk").classList.remove("on");
else if(a=="trend"){const x=D.find(y=>y.id==d.id);TR={sub:"lvl",rng:"ctx",focus:x.s,label:x.type+" "+x.id};go("trd")}
else if(a=="tsub"){TR.sub=d.s;draw()}
else if(a=="ts"){TS[d.k]=d.v;draw()}
else if(a=="pg"){PG[d.k]+=+d.d;draw()}
else if(a=="mpump"){mp=+d.i;tipOn=null;draw()}else if(a=="tip"){tipOn=tipOn==d.i?null:d.i;draw()}
else if(a=="phs"){php=+d.i;draw()}else if(a=="phal"){A.c=d.c;A.s="";A.r=30;go("alm")}
else if(a=="cm"){cmenu=+d.i;draw()}else if(a=="cf"){CF=+d.i;draw()}else if(a=="cpl")toast("Poll Station Configuration requested (simulated)");
else if(a=="cpoll"){const n=d.n;addCmd(n.startsWith("Poll")?n:"Poll "+n,"Poll "+n,true)}
else if(a=="cupd"){const i=d.i,n=d.n,u=n==CMENU[0][1][0]?"in":"";mdl(`<h3>Update: ${n}</h3><label>New value ${u?"("+u+")":""}<input id="nv" type="number" step="any"></label><div class="tl"><button class="btn p" data-a="cgo" data-n="${n}" data-i="${i}">Send command</button><button class="btn" data-a="ok">Cancel</button></div>`)}
else if(a=="cgo"){const v=$("#nv").value;if(v===""){toast("Enter a value first");return}$("#mk").classList.remove("on");const ok=+v>0&&+v<=120||d.n!=CMENU[0][1][0],nm=d.n==CMENU[0][1][0]?(d.i==0?"Wet Well Low Level Set Point":"Wet Well High Level Set Point"):d.n,old=pv[d.n+d.i];
const o=addCmd(nm,`Update ${nm} : ${old?old.v:"-"} → ${v}${d.n==CMENU[0][1][0]?" in":""}`,ok);o.done=()=>{pv[d.n+d.i]={v,t:+now()}}}
else if(a=="sim"){sim=!sim;closeP();draw();toast(sim?"Mock clock moved to 10/15/2026 11:31 AM":"Mock clock restored")}
else if(a=="reset"){sim=false;D=mkAlarms();cmds=CM();pv={};Object.assign(A,{t:"",c:"",s:"",v:"",q:"",r:30,sel:null});TR={sub:"lvl",rng:"7d",focus:null,label:""};MQ=cq="";PG.a=PG.m=PG.c=1;closeP();draw();toast("Demo data reset")}});
document.addEventListener("change",e=>{const k=e.target.dataset.f,v=e.target.value;if(!k)return;
const m={at:"t",ac:"c",as:"s",av:"v",ar:"r"};if(m[k]){A[m[k]]=m[k]=="r"?+v:v;PG.a=1;draw()}
else if(k[0]=="n"&&k.length==2){N[k[1]]=+v;PG[k[1]]=1;draw()}else if(k=="tr"){TR.rng=v;draw()}});
document.addEventListener("input",e=>{const k=e.target.dataset.f,v=e.target.value;if(k=="aq"){A.q=v;PG.a=1;updA()}else if(k=="mq"){MQ=v;PG.m=1;$("#tbl").innerHTML=mTbl()}else if(k=="cq"){cq=v;PG.c=1;$("#tbl").innerHTML=cTbl()}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#mk").classList.contains("on")?$("#mk").classList.remove("on"):closeP()}if(e.key=="Enter"&&e.target.dataset&&e.target.dataset.a)e.target.click()});
$("#mk").onclick=e=>{if(e.target.id=="mk")$("#mk").classList.remove("on")};
draw();
</script></body></html>
