let view="inbox",activeTab="inbox",selectedId=null,expandedId=null,filter={q:"",station:"",severity:"",event:"",status:"",range:"30",channel:""},mutedQ="",suggestQ="",prefCategory=null,recipientQ="",subQ="",roleFilter="",selectedUsers=new Set(),bulkChannel="Web Push",bulkValue="true",selectedCategory="wet",page=1,toastTimer;
const totalEvents=()=>notificationEvents.length, failedCount=()=>life.reduce((n,x)=>n+x.deliveries.filter(d=>d.status==="Failed").length,0), unreadCount=()=>notificationEvents.filter(x=>!x.read).length,activeCount=()=>life.filter(x=>x.status==="Active").length;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove("show"),2600)}
function setView(v){view=v;selectedId=null;closeDrawer();render()}
function badge(text,cls){return `<span class="badge ${cls}">${esc(text)}</span>`}
function statusBadge(x){return badge(x.status,x.status==="Resolved"?"resolved":x.status==="Acknowledged"?"ack":"active")}
function sevBadge(x){return badge(x.severity,x.severity==="Critical"?"critical":x.severity==="Warning"?"warning":"info")}
function filteredLife(){const q=filter.q.toLowerCase(), days=+filter.range;return life.filter(x=>{const hit=[x.name,x.station,x.id,x.reason].join(" ").toLowerCase().includes(q), age=(Date.now()-new Date(x.start))/864e5;return hit&&(!filter.station||x.station===filter.station)&&(!filter.severity||x.severity===filter.severity)&&(!filter.event||x.name===filter.event)&&(!filter.status||x.status===filter.status)&&(!filter.range||age<=days)&&(!filter.channel||x.deliveries.some(d=>d.channel===filter.channel))})}
function render(){const root=$("#view");if(view==="inbox")root.innerHTML=renderInbox();else if(view==="muted")root.innerHTML=renderMuted();else if(view==="suggestions")root.innerHTML=renderSuggestions();else if(view==="preferences")root.innerHTML=renderPreferences();else if(view==="manage")root.innerHTML=renderManage();else if(view==="details")root.innerHTML=renderDetails();updateDrawer()}
function renderTabs(){return `<div class="tabs"><button class="tab ${activeTab==="inbox"?"active":""}" data-action="tab" data-tab="inbox">Notification Inbox</button><button class="tab ${activeTab==="muted"?"active":""}" data-action="tab" data-tab="muted">Muted Notifications</button><button class="tab ${activeTab==="suggestions"?"active":""}" data-action="tab" data-tab="suggestions">✦ Mute Suggestions</button><span class="grow"></span><button class="btn link" data-action="view" data-view="manage">⚙ Manage Subscriptions</button><button class="btn link" data-action="view" data-view="preferences">Notification Preferences</button></div>`}
function renderInbox(){const rows=filteredLife();const stations=[...new Set(life.map(x=>x.station))],events=[...new Set(life.map(x=>x.name))];return `${renderTabs()}<div class="summary"><div class="summary-card"><span class="summary-icon">▤</span><div><small>Total notifications</small><strong>${totalEvents()}</strong></div></div><div class="summary-card"><span class="summary-icon" style="color:var(--red);background:var(--redbg)">!</span><div><small>Active alarm notifications</small><strong>${activeCount()}</strong></div></div><div class="summary-card"><span class="summary-icon">●</span><div><small>Unread notifications</small><strong>${unreadCount()}</strong></div></div><div class="summary-card"><span class="summary-icon" style="color:var(--red);background:var(--redbg)">↗</span><div><small>Failed delivery attempts</small><strong>${failedCount()}</strong></div></div></div>
<div class="toolbar"><input class="search" data-filter="q" placeholder="Search station, alarm, or notification" value="${esc(filter.q)}"><select data-filter="station"><option value="">All Stations</option>${stations.map(x=>`<option ${filter.station===x?"selected":""}>${esc(x)}</option>`).join("")}</select><select data-filter="severity"><option value="">All Severity</option>${["Critical","Warning","Info"].map(x=>`<option ${filter.severity===x?"selected":""}>${x}</option>`).join("")}</select><select data-filter="event"><option value="">All Event Types</option>${events.map(x=>`<option ${filter.event===x?"selected":""}>${esc(x)}</option>`).join("")}</select><select data-filter="status"><option value="">All Lifecycle Status</option>${["Active","Acknowledged","Resolved"].map(x=>`<option ${filter.status===x?"selected":""}>${x}</option>`).join("")}</select><select data-filter="range"><option value="30" ${filter.range==="30"?"selected":""}>Last 30 days</option><option value="7" ${filter.range==="7"?"selected":""}>Last 7 days</option><option value="">All dates</option></select><select data-filter="channel"><option value="">All Channels</option>${["Email","Web Push","SMS"].map(x=>`<option ${filter.channel===x?"selected":""}>${x}</option>`).join("")}</select><button class="btn small" data-action="refresh">↻ Refresh</button><button class="btn link small" data-action="clear-filters">Clear filters</button></div>
<div class="section-head"><h2>Alarm notification groups</h2><span class="count">${rows.length} of ${life.length} incidents</span></div><section class="panel table-wrap"><table class="main-table"><thead><tr><th>Severity / Alarm</th><th>Station</th><th>First occurrence</th><th>Last occurrence</th><th>Messages</th><th>Lifecycle</th><th>Read state</th><th>Delivery</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>{const unread=notificationEvents.some(n=>n.lifecycleId===x.id&&!n.read),failed=x.deliveries.some(d=>d.status==="Failed"),success=x.deliveries.some(d=>["Sent","Delivered"].includes(d.status)),delivery=failed&&success?"Mixed":failed?"Failed":x.deliveries.some(d=>d.status==="Delivered")?"Delivered":success?"Sent":"Queued";return `<tr><td>${sevBadge(x)}<span class="row-title" style="display:block;margin-top:5px">${esc(x.name)}</span>${x.ack?`<span class="subtext">Acknowledged by ${esc(x.ackBy||"operator")}</span>`:""}</td><td><button class="btn link small" data-action="station" data-id="${x.id}">${esc(x.station)}</button></td><td>${fmt(x.start)}</td><td>${fmt(x.last)}</td><td><button class="btn link small" data-action="expand" data-id="${x.id}">${x.events.length} ${x.events.length===1?"message":"messages"} ${expandedId===x.id?"▴":"▾"}</button></td><td>${statusBadge(x)}</td><td>${unread?`<span class="unread-dot"></span>${badge("Unread","unread")}`:badge("Read","read")}</td><td>${badge(delivery,delivery.toLowerCase())}</td><td><div class="inline-actions"><button class="btn small" data-action="open-detail" data-id="${x.id}">Details</button><button class="icon-action" aria-label="More actions" data-action="open-detail" data-id="${x.id}">•••</button></div></td></tr>${expandedId===x.id?`<tr class="expanded-row"><td colspan="9"><div class="event-history">${notificationEvents.filter(n=>n.lifecycleId===x.id).map((n,i)=>`<div class="event-chip"><b>${shortTime(n.timestamp)}</b> · ${i===0?"Lifecycle started":"Repeat notification event"} · ${n.read?"Read":"Unread"}</div>`).join("")}</div><div class="muted-note">Grouped by lifecycle <b>${x.id}</b>. A later activation after valid resolution receives a new lifecycle ID and appears separately.</div></td></tr>`:""}`}).join("")||`<tr><td colspan="9" class="empty"><strong>No notifications match these filters.</strong>Clear or adjust filters to see other alarm lifecycles.</td></tr>`}</tbody></table></section><p class="muted-note">Alarm lifecycle status is separate from notification read state and delivery status. A sent message is not necessarily confirmed delivered.</p>`}
function renderMuted(){const rows=muted.filter(x=>[x.station,x.event,x.scope,x.by,x.reason].join(" ").toLowerCase().includes(mutedQ.toLowerCase()));return `${renderTabs()}<div class="callout"><b>Muted notifications</b><p>Mute rules suppress selected notification deliveries. They do not resolve an alarm or remove its operational history.</p></div><div class="toolbar"><input class="search" data-state="mutedQ" placeholder="Search station, event, or person" value="${esc(mutedQ)}"><span class="count">${rows.length} active mute rule${rows.length===1?"":"s"}</span></div>${rows.length?`<section class="panel table-wrap"><table class="mute-table"><thead><tr><th>Station</th><th>Event / Alarm</th><th>Mute scope</th><th>Muted by</th><th>Muted at</th><th>Expiry</th><th>Reason</th><th>Action</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.station)}</td><td>${esc(x.event)}</td><td>${esc(x.scope)}</td><td>${esc(x.by)}</td><td>${fmt(x.at)}</td><td>${x.expires?`<span class="expiring">${fmt(x.expires)}</span>`:"No expiry"}</td><td>${esc(x.reason||"—")}</td><td><button class="btn small" data-action="unmute" data-id="${x.id}">Unmute</button></td></tr>`).join("")}</tbody></table></section>`:`<section class="panel empty"><strong>No notifications are currently muted.</strong>Mute rules only affect delivery; alarm status and history remain available in the inbox.</section>`}`}
function renderSuggestions(){const rows=suggestions.filter(x=>[x.station,x.event,x.reason,x.status].join(" ").toLowerCase().includes(suggestQ.toLowerCase()));return `${renderTabs()}<div class="callout warn"><b>Review repetition in context</b><p>Frequent notifications can be notification noise or evidence of a real ongoing issue. A critical active alarm is never resolved or hidden by muting. For active critical incidents, this prototype only allows a clearly scoped mute of redundant reminders.</p></div><div class="toolbar"><input class="search" data-state="suggestQ" placeholder="Search suggestions" value="${esc(suggestQ)}"><span class="count">${rows.length} suggestion${rows.length===1?"":"s"}</span></div>${rows.length?`<section class="panel table-wrap"><table class="suggest-table"><thead><tr><th>Station / Event</th><th>Occurrences</th><th>First occurred</th><th>Last occurred</th><th>Alarm status</th><th>Why suggested</th><th>Suggested action</th><th>Actions</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.event)}</b><span class="subtext">${esc(x.station)} · ${x.severity}</span></td><td><b>${x.count} notifications / ${esc(x.window)}</b></td><td>${fmt(x.first)}</td><td>${fmt(x.last)}</td><td>${badge(x.status,x.status==="Resolved"?"resolved":"active")}</td><td>${esc(x.reason)}</td><td>${esc(x.suggest)}</td><td><div class="inline-actions"><button class="btn small" data-action="review-suggestion" data-id="${x.id}">Review history</button><button class="btn small" data-action="mute-suggestion" data-id="${x.id}">Mute…</button><button class="btn link small" data-action="dismiss-suggestion" data-id="${x.id}">Dismiss</button></div></td></tr>`).join("")}</tbody></table></section>`:`<section class="panel empty"><strong>No mute suggestions.</strong>Suggestions will appear when mock event history meets the repetition rule.</section>`}`}
function renderPreferences(){const dirty=JSON.stringify(preferences)!==JSON.stringify(draftPrefs);return `${renderTabs()}<div class="callout">Your preferences control which eligible notifications are delivered through each channel. Station access and administrator policies may also affect delivery. A preference does not guarantee delivery.</div><div class="section-head"><h2>Personal notification preferences</h2><span class="count">Changes are local to this prototype</span></div><section class="panel">${cats.map(c=>{const p=draftPrefs[c.id];return `<div class="pref-row"><div><b>${esc(c.name)}</b><span class="subtext">${esc(c.description)}</span><button class="btn link small" data-action="expand-pref" data-id="${c.id}">${prefCategory===c.id?"Hide event settings":"Configure events"} (${c.events.length})</button></div><div class="pref-grid"><span>Email</span><span>Web Push</span><span>SMS</span><label><input type="checkbox" class="switch" data-pref-cat="${c.id}" data-channel="Email" ${p.channels.Email?"checked":""} aria-label="Email for ${esc(c.name)}"></label><label><input type="checkbox" class="switch" data-pref-cat="${c.id}" data-channel="Web Push" ${p.channels["Web Push"]?"checked":""} aria-label="Web Push for ${esc(c.name)}"></label><label><input type="checkbox" class="switch" data-pref-cat="${c.id}" data-channel="SMS" ${p.channels.SMS?"checked":""} aria-label="SMS for ${esc(c.name)}"></label></div><label class="checkline"><input type="checkbox" data-recovery="${c.id}" ${p.recovery?"checked":""}> Send recovery/clear notification</label></div>${prefCategory===c.id?`<div class="event-expand"><b>Event preferences</b><span class="subtext">Available events depend on LiftIQ's configured event definitions.</span>${c.events.map(e=>`<div class="event-preferences"><span>${esc(e)}</span>${["Email","Web Push","SMS"].map(ch=>`<label><input type="checkbox" data-pref-event="${c.id}" data-event="${esc(e)}" data-channel="${ch}" ${p.events[e+"|"+ch]??p.events[e]?"checked":""} aria-label="${ch} for ${esc(e)}"></label>`).join("")}<label class="checkline recover"><input type="checkbox" data-pref-event-recovery="${c.id}" data-event="${esc(e)}" ${p.events[e+"|recovery"]??p.events[e]?"checked":""}> Recovery</label></div>`).join("")}</div>`:""}`}).join("")}</section><div class="settings-footer"><button class="btn" data-action="cancel-prefs" ${dirty?"":"disabled"}>Cancel</button><button class="btn primary" data-action="save-prefs" ${dirty?"":"disabled"}>Save Changes</button></div>`}
function renderManage(){const q=subQ;return `${renderTabs()}<div class="section-head"><h2>Manage Subscriptions</h2><span class="count">Administrator catalogue · ${subs.length} subscriptions</span></div><div class="toolbar"><input class="search" data-state="subQ" placeholder="Search subscriptions" value="${esc(q)}"><button class="btn small" data-action="create-sub">＋ Create subscription</button></div><section class="panel table-wrap"><table><thead><tr><th>Subscription name</th><th>Description</th><th>Configured events</th><th>Eligible recipients</th><th>Available channels</th><th>Last updated</th><th>Action</th></tr></thead><tbody>${subs.filter(x=>[x.name,x.description].join(" ").toLowerCase().includes(q.toLowerCase())).map(x=>`<tr><td><button class="btn link small" data-action="subscription-detail" data-id="${x.id}">${esc(x.name)}</button></td><td>${esc(x.description)}</td><td>${x.configured}</td><td>${x.recipients}</td><td>${x.channels.map(c=>`<span class="channel">${c}</span>`).join(" ")}</td><td>${fmt(x.updated)}</td><td><button class="btn small" data-action="subscription-detail" data-id="${x.id}">Open</button></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No subscription categories match your search.</td></tr>`}</tbody></table></section><p class="muted-note">Eligible-recipient counts are illustrative. User access and administrator policy still apply to delivery.</p>`}
function renderDetails(){const c=cats.find(x=>x.id===selectedCategory),cfg=eventDraft[c.id],users=recipients.filter(u=>(!recipientQ||[u.name,u.email,u.phone,u.role].join(" ").toLowerCase().includes(recipientQ.toLowerCase()))&&(!roleFilter||u.role===roleFilter));return `<div class="details-head"><button class="btn link" data-action="view" data-view="manage">‹ Manage Subscriptions</button><h2>${esc(c.name)}</h2><button class="btn" data-action="toggle-edit">${eventSaved?"Edit":"Cancel editing"}</button></div><p class="muted-note">${esc(c.description)} Activation and recovery preferences are configured separately.</p><section class="panel"><div style="padding:12px 14px"><h3 style="margin:0 0 8px">Event configuration</h3><div class="event-preferences" style="grid-template-columns:minmax(280px,1fr) 120px 120px"><b>Supported event</b><b>Activation</b><b>Recovery</b></div>${c.events.map(e=>`<div class="event-preferences" style="grid-template-columns:minmax(280px,1fr) 120px 120px"><span>${esc(e)}</span><label><input type="checkbox" class="check" data-event-config="activation" data-event="${esc(e)}" ${cfg.activation[e]?"checked":""} ${eventSaved?"disabled":""}> Enabled</label><label><input type="checkbox" class="check" data-event-config="recovery" data-event="${esc(e)}" ${cfg.recovery[e]?"checked":""} ${eventSaved?"disabled":""}> Enabled</label></div>`).join("")||`<div class="empty">No event definitions are configured for this subscription yet.</div>`}<div class="settings-footer"><button class="btn" data-action="cancel-events" ${eventSaved?"disabled":""}>Cancel</button><button class="btn primary" data-action="save-events" ${eventSaved?"disabled":""}>Save event settings</button></div></div></section>

function renderDrawer(x){const duration=x.resolved?`${Math.round((new Date(x.resolved)-new Date(x.start))/60000)} minutes`:"Ongoing";return `<div class="drawer-head"><div>${sevBadge(x)}<h2 style="margin-top:6px">${esc(x.name)}</h2><div>${esc(x.station)} · ${statusBadge(x)}</div></div><button class="drawer-close" data-action="close-drawer" aria-label="Close">×</button></div><div class="drawer-section"><h3>Alarm lifecycle</h3><div class="drawer-body"><dl class="kv"><dt>Lifecycle ID</dt><dd>${x.id}</dd><dt>Started</dt><dd>${fmt(x.start)}</dd><dt>Last observed</dt><dd>${fmt(x.last)}</dd><dt>Resolved at</dt><dd>${x.resolved?fmt(x.resolved):"—"}</dd><dt>Duration</dt><dd>${duration}</dd><dt>Repeat count</dt><dd>${x.events.length}</dd><dt>Freshness</dt><dd>${x.status==="Active"?badge("Current data","good"):"Historical record"}</dd><dt>Acknowledgement</dt><dd>${x.ack?`Acknowledged by ${esc(x.ackBy)} at ${fmt(x.ackAt)}`:"Not acknowledged"}</dd></dl><p class="muted-note">${esc(x.reason)}</p></div></div><div class="drawer-section"><h3>Event timeline</h3><div class="drawer-body"><ul class="timeline">${x.timeline.map(t=>`<li><time>${fmt(t.time)}</time><div>${esc(t.text)}</div></li>`).join("")}</ul></div></div><div class="drawer-section"><h3>Notification delivery attempts</h3><div class="drawer-body">${x.deliveries.map(d=>`<div class="delivery-row"><b>${esc(d.channel)}</b><span>${fmt(d.time)}<small class="subtext">${esc(d.detail)}</small></span>${badge(d.status,d.status.toLowerCase())}</div>`).join("")}</div></div><div class="drawer-actions"><button class="btn" data-action="toggle-read" data-id="${x.id}">Mark as ${x.read?"unread":"read"}</button>${x.status==="Active"?`<button class="btn" data-action="ack" data-id="${x.id}" ${x.ack?"disabled":""}>${x.ack?"Acknowledged":"Acknowledge alarm"}</button>`:""}<button class="btn" data-action="station" data-id="${x.id}">Open station</button><button class="btn" data-action="alarm-details" data-id="${x.id}">View alarm details</button>${/level/i.test(x.name)?`<button class="btn primary" data-action="trend" data-id="${x.id}">View level trend</button>`:""}</div><p class="muted-note">Prototype action only. Acknowledgement does not resolve an alarm; resolution requires valid lifecycle evidence.</p>`}
function updateDrawer(){const x=life.find(a=>a.id===selectedId),d=$("#drawer"),b=$("#drawer-backdrop");if(x){d.innerHTML=renderDrawer(x);d.classList.add("open");b.classList.add("open");d.setAttribute("aria-hidden","false")}else{d.classList.remove("open");b.classList.remove("open");d.setAttribute("aria-hidden","true")}}

function modal(content){$("#modal").innerHTML=content;$("#modal-backdrop").classList.add("open")}
function closeModal(){$("#modal-backdrop").classList.remove("open")}
function muteModal(s){const x=life.find(a=>a.id===s.lifecycleId),risk=x&&x.status!=="Resolved"&&x.severity==="Critical";modal(`<h2>Mute notification reminders?</h2><p><b>${esc(s.event)}</b> · ${esc(s.station)}</p><p>Scope: <b>${risk?"Redundant reminders for this lifecycle only":"This lifecycle only"}</b></p>${risk?`<div class="callout warn"><b>Active critical alarm</b><p>This only suppresses repeated notification reminders for the selected duration. The alarm remains active and visible in alarm management. Confirm you are authorized to apply this temporary delivery rule.</p></div>`:`<p>This mute affects delivery only. It will not change alarm lifecycle status.</p>`}<label>Mute duration<select id="mute-duration"><option value="1">1 hour</option><option value="8" selected>8 hours</option><option value="24">24 hours</option><option value="0">Until manually unmuted</option></select></label><label>Reason (optional)<input id="mute-reason" type="text" value="Reduce redundant notifications" style="width:100%"></label><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-mute" data-id="${s.id}">Confirm temporary mute</button></div>`)}
function reviewSuggestion(id){const s=suggestions.find(a=>a.id===id);setView("inbox");expandedId=s.lifecycleId;openDrawer(s.lifecycleId)}
function savePrefs(){preferences=JSON.parse(JSON.stringify(draftPrefs));toast("Notification preferences saved in this prototype");render()}
function saveEvents(){savedEventDraft=JSON.parse(JSON.stringify(eventDraft));eventSaved=true;const s=subs.find(x=>x.id===selectedCategory);if(s){s.configured=cats.find(x=>x.id===selectedCategory).events.filter(e=>eventDraft[selectedCategory].activation[e]||eventDraft[selectedCategory].recovery[e]).length;s.updated=new Date().toISOString()}toast("Subscription event settings saved locally");render()}
function csvDownload(){const lines=["Station,Event,Status,First occurrence,Last occurrence,Messages",...life.map(x=>[x.station,x.name,x.status,fmt(x.start),fmt(x.last),x.events.length].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(","))];const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));a.download="liftiq-notifications.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function clickAction(a,d){
 if(a==="tab"){activeTab=d.tab;setView(d.tab);return} if(a==="view"){if(d.view==="details"){setView("details");return}activeTab=d.view;setView(d.view);return}
 if(a==="open-detail"){openDrawer(d.id);return} if(a==="close-drawer"){closeDrawer();return} if(a==="expand"){expandedId=expandedId===d.id?null:d.id;render();return}
 if(a==="toggle-read"){const x=life.find(x=>x.id===d.id);x.read=!x.read;notificationEvents.filter(n=>n.lifecycleId===x.id).forEach(n=>n.read=x.read);render();selectedId=x.id;updateDrawer();return}
 if(a==="ack"){const x=life.find(x=>x.id===d.id);if(!x.ack){x.ack=true;x.status="Acknowledged";x.ackBy="Venky Karuppanan";x.ackAt=new Date().toISOString();toast("Alarm acknowledged; lifecycle remains unresolved")}render();selectedId=x.id;updateDrawer();return}
 if(a==="station"){const x=life.find(x=>x.id===d.id);modal(`<h2>Station context</h2><p><b>${esc(x?.station||"LiftIQ station")}</b></p><p>This standalone prototype does not connect to station controls. Open Station is represented here as a contextual preview.</p><div class="modal-foot"><button class="btn primary" data-action="close-modal">Close</button></div>`);return}
 if(a==="alarm-details"){const x=life.find(x=>x.id===d.id);modal(`<h2>Alarm details · ${esc(x.name)}</h2><dl class="kv"><dt>Lifecycle ID</dt><dd>${x.id}</dd><dt>Status</dt><dd>${x.status}</dd><dt>Station</dt><dd>${esc(x.station)}</dd><dt>Current evidence</dt><dd>${esc(x.reason)}</dd></dl><div class="modal-foot"><button class="btn primary" data-action="close-modal">Close</button></div>`);return}
 if(a==="trend"){const x=life.find(x=>x.id===d.id);modal(`<h2>Wet well level trend</h2><p>${esc(x.station)} · centered on ${fmt(x.start)} · Illustrative telemetry for the prototype.</p>${trendSvg()}<div class="modal-foot"><button class="btn primary" data-action="close-modal">Close</button></div>`);return}
 if(a==="refresh"){render();toast("Notification list refreshed from local mock data");return} if(a==="clear-filters"){filter={q:"",station:"",severity:"",event:"",status:"",range:"30",channel:""};render();return}
 if(a==="review-suggestion"){reviewSuggestion(d.id);return} if(a==="mute-suggestion"){const s=suggestions.find(x=>x.id===d.id);muteModal(s);return}
 if(a==="dismiss-suggestion"){suggestions=suggestions.filter(x=>x.id!==d.id);render();toast("Suggestion dismissed for this prototype session");return}
 if(a==="confirm-mute"){const s=suggestions.find(x=>x.id===d.id),x=life.find(x=>x.id===s.lifecycleId),hours=+$("#mute-duration").value;muted.push({id:"MR-"+(Date.now()),lifecycleId:x.id,station:x.station,event:x.name,scope:x.status!=="Resolved"&&x.severity==="Critical"?"Redundant reminders · lifecycle only":"This lifecycle",by:"Venky Karuppanan",at:new Date().toISOString(),expires:hours?new Date(Date.now()+hours*36e5).toISOString():null,reason:$("#mute-reason").value.trim()});suggestions=suggestions.filter(z=>z.id!==s.id);closeModal();render();toast("Mute rule added; alarm lifecycle was not changed");return}
 if(a==="unmute"){muted=muted.filter(x=>x.id!==d.id);render();toast("Mute rule removed; notifications may resume");return}
 if(a==="expand-pref"){prefCategory=prefCategory===d.id?null:d.id;render();return}
 if(a==="save-prefs"){savePrefs();return}if(a==="cancel-prefs"){draftPrefs=JSON.parse(JSON.stringify(preferences));render();return}
 if(a==="subscription-detail"){selectedCategory=d.id;if(!eventDraft[d.id]){eventDraft[d.id]={activation:Object.fromEntries(cats.find(c=>c.id===d.id).events.map(e=>[e,true])),recovery:Object.fromEntries(cats.find(c=>c.id===d.id).events.map(e=>[e,true]))};savedEventDraft={...savedEventDraft,[d.id]:eventDraft[d.id]}}eventDraft=JSON.parse(JSON.stringify(savedEventDraft));eventSaved=true;setView("details");return}
 if(a==="toggle-edit"){if(eventSaved){eventDraft=JSON.parse(JSON.stringify(savedEventDraft));eventSaved=false}else{eventDraft=JSON.parse(JSON.stringify(savedEventDraft));eventSaved=true}render();return}if(a==="save-events"){saveEvents();return}if(a==="cancel-events"){eventDraft=JSON.parse(JSON.stringify(savedEventDraft));eventSaved=true;render();toast("Event changes cancelled");return}
 if(a==="create-sub"){modal(`<h2>Create subscription</h2><label>Name<input id="new-sub-name" type="text" maxlength="60" placeholder="Subscription name" style="width:100%"></label><label>Description<input id="new-sub-description" type="text" maxlength="120" placeholder="Short description" style="width:100%"></label><p class="muted-note">A new empty catalogue category is added locally. Configure supported events separately in the connected application.</p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-new-sub">Create</button></div>`);return}
 if(a==="save-new-sub"){const name=$("#new-sub-name").value.trim(),description=$("#new-sub-description").value.trim();if(!name){toast("Enter a subscription name");return}const id="custom-"+Date.now();cats.push({id,name,description:description||"Custom notification subscription.",events:[]});subs.push({id,name,description:description||"Custom notification subscription.",configured:0,recipients:0,channels:["Email","Web Push","SMS"],updated:new Date().toISOString()});prefBase[id]={channels:{Email:false,"Web Push":false,SMS:false},recovery:false,events:{}};preferences[id]=JSON.parse(JSON.stringify(prefBase[id]));draftPrefs[id]=JSON.parse(JSON.stringify(prefBase[id]));eventDraft[id]={activation:{},recovery:{}};savedEventDraft[id]=JSON.parse(JSON.stringify(eventDraft[id]));closeModal();render();toast("Subscription created in this prototype");return}
 if(a==="bulk-apply"){const selected=[...selectedUsers];if(!selected.length)return;const names=recipients.filter(u=>selected.includes(u.id));modal(`<h2>Confirm bulk channel update</h2><p>Set <b>${bulkChannel}</b> to <b>${bulkValue==="true"?"enabled":"disabled"}</b> for ${names.length} selected users?</p><p>${names.map(u=>esc(u.name)).join(", ")}</p>${bulkChannel==="SMS"&&names.some(u=>!u.phone)?`<div class="callout warn">Users without a phone number will be skipped.</div>`:""}<p>This updates only selected mock recipients.</p><div class="modal-foot"><button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-bulk">Confirm update</button></div>`);return}
 if(a==="confirm-bulk"){const selected=[...selectedUsers];recipients.filter(u=>selected.includes(u.id)).forEach(u=>{if(bulkChannel!=="SMS"||u.phone)u.channels[bulkChannel]=bulkValue==="true"});selectedUsers.clear();closeModal();render();toast("Selected recipient settings updated locally");return}
 if(a==="select-visible"){const users=recipients.filter(u=>(!recipientQ||[u.name,u.email,u.phone,u.role].join(" ").toLowerCase().includes(recipientQ.toLowerCase()))&&(!roleFilter||u.role===roleFilter));if(d.checked)users.forEach(u=>selectedUsers.add(u.id));else users.forEach(u=>selectedUsers.delete(u.id));render();return}
 if(a==="close-modal"){closeModal();return}if(a==="export"){csvDownload();return}if(a==="help"){modal(`<h2>Notifications help</h2><p>Inbox rows group delivery events by alarm lifecycle. Read state, acknowledgement, lifecycle state, and delivery attempts are tracked separately in this local prototype.</p><div class="modal-foot"><button class="btn primary" data-action="close-modal">Close</button></div>`);return}if(a==="apps"||a==="nav-stub"){toast("This standalone prototype only implements the Notifications module");return}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;clickAction(b.dataset.action,{...b.dataset,checked:b.checked})});
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.filter&&!t.dataset.state)return;const attr=t.dataset.filter?"data-filter":"data-state",key=t.dataset.filter||t.dataset.state,pos=t.selectionStart;if(t.dataset.filter)filter[key]=t.value;else if(key==="mutedQ")mutedQ=t.value;else if(key==="suggestQ")suggestQ=t.value;else if(key==="recipientQ")recipientQ=t.value;else if(key==="subQ")subQ=t.value;render();const next=document.querySelector(`[${attr}="${key}"]`);if(next){next.focus();if(typeof next.setSelectionRange==="function"&&pos!==null)next.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.filter){filter[t.dataset.filter]=t.value;render()}else if(t.dataset.state){const k=t.dataset.state;if(k==="roleFilter")roleFilter=t.value;if(k==="bulkChannel")bulkChannel=t.value;if(k==="bulkValue")bulkValue=t.value;render()}else if(t.dataset.prefCat){const p=draftPrefs[t.dataset.prefCat],ch=t.dataset.channel;p.channels[ch]=t.checked;cats.find(c=>c.id===t.dataset.prefCat).events.forEach(event=>p.events[event+"|"+ch]=t.checked);render()}else if(t.dataset.recovery){const p=draftPrefs[t.dataset.recovery];p.recovery=t.checked;cats.find(c=>c.id===t.dataset.recovery).events.forEach(event=>p.events[event+"|recovery"]=t.checked);render()}else if(t.dataset.prefEvent){draftPrefs[t.dataset.prefEvent].events[t.dataset.event+"|"+t.dataset.channel]=t.checked;render()}else if(t.dataset.prefEventRecovery){draftPrefs[t.dataset.prefEventRecovery].events[t.dataset.event+"|recovery"]=t.checked;render()}else if(t.dataset.eventConfig){eventDraft[selectedCategory][t.dataset.eventConfig][t.dataset.event]=t.checked;eventSaved=false;render()}else if(t.dataset.userChannel){const u=recipients.find(u=>u.id===t.dataset.userChannel);u.channels[t.dataset.channel]=t.checked;toast("Recipient preference updated locally")}else if(t.dataset.userSelect){t.checked?selectedUsers.add(t.dataset.userSelect):selectedUsers.delete(t.dataset.userSelect);render()}else if(t.dataset.action==="select-visible"){clickAction("select-visible",{checked:t.checked})}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();closeDrawer()}if(e.key==="Enter"&&e.target.matches("[data-action=expand]"))e.target.click()});
$("#modal-backdrop").addEventListener("click",e=>{if(e.target.id==="modal-backdrop")closeModal()});
render();
</script>
</body>
</html>
